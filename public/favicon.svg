<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="void-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0cc6ff" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#07131e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#03050a" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="barcode-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0cc6ff" />
      <stop offset="50%" stop-color="#49e7ff" />
      <stop offset="100%" stop-color="#b6f6ff" />
    </linearGradient>
    <filter id="azure-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Void Background -->
  <rect width="512" height="512" fill="#03050a" rx="100" />
  <circle cx="256" cy="256" r="230" fill="url(#void-glow)" />

  <!-- Outer Orbit Loom Conic Rings -->
  <ellipse cx="256" cy="256" rx="210" ry="110" fill="none" stroke="#0cc6ff" stroke-width="2" stroke-opacity="0.4" transform="rotate(-25 256 256)" />
  <ellipse cx="256" cy="256" rx="170" ry="85" fill="none" stroke="#49e7ff" stroke-width="1.5" stroke-dasharray="4 8" stroke-opacity="0.5" transform="rotate(-25 256 256)" />
  <ellipse cx="256" cy="256" rx="130" ry="65" fill="none" stroke="#b6f6ff" stroke-width="1" stroke-opacity="0.3" transform="rotate(-25 256 256)" />

  <!-- Black Stellar Disc -->
  <circle cx="256" cy="256" r="90" fill="#03050a" stroke="#0cc6ff" stroke-width="3" filter="url(#azure-glow)" />
  <circle cx="256" cy="256" r="86" fill="#000000" />

  <!-- Ordered Azure Barcode Filaments Piercing Core -->
  <g transform="rotate(-25 256 256)">
    <!-- Parallel vertical barcode lines cutting through the disc -->
    <rect x="216" y="160" width="3" height="192" fill="#0cc6ff" />
    <rect x="224" y="150" width="5" height="212" fill="#49e7ff" />
    <rect x="233" y="170" width="2" height="172" fill="#b6f6ff" />
    <rect x="240" y="140" width="8" height="232" fill="#0cc6ff" />
    <rect x="252" y="130" width="4" height="252" fill="#b6f6ff" />
    <rect x="260" y="140" width="6" height="232" fill="#49e7ff" />
    <rect x="270" y="165" width="2" height="182" fill="#0cc6ff" />
    <rect x="276" y="150" width="7" height="212" fill="#b6f6ff" />
    <rect x="287" y="160" width="3" height="192" fill="#49e7ff" />
    <rect x="294" y="175" width="4" height="162" fill="#0cc6ff" />

    <!-- Trajectory Focal Crosshair -->
    <line x1="160" y1="256" x2="352" y2="256" stroke="#49e7ff" stroke-width="1" stroke-opacity="0.7" />
    <circle cx="256" cy="256" r="4" fill="#ffffff" />
  </g>
</svg>
