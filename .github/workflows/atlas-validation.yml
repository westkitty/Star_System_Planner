name: Starsilk Atlas validation
on:
  push:
    branches: [feature/map-of-the-all-prototype,fix/atlas-visible-cosmos-pulldown-ui]
    paths:
      - 'map-of-the-all/**'
      - 'src/tests/atlas-handoff-import.test.js'
      - 'scripts/spatial-studio-browser-ci.mjs'
      - 'scripts/phase4-browser-ci.mjs'
      - 'scripts/phase5-browser-ci.mjs'
      - 'scripts/phase6-browser-ci.mjs'
      - 'scripts/atlas-focus-browser-ci.mjs'
      - 'scripts/atlas-cinematic-browser-ci.mjs'
      - 'scripts/system-zoom-browser-ci.mjs'
      - 'vite.config.ts'
      - 'scripts/legacy-retirement-browser-ci.mjs'
      - '.github/workflows/atlas-validation.yml'
  pull_request:
    paths:
      - 'map-of-the-all/**'
      - 'src/tests/atlas-handoff-import.test.js'
      - 'scripts/spatial-studio-browser-ci.mjs'
      - 'scripts/phase4-browser-ci.mjs'
      - 'scripts/phase5-browser-ci.mjs'
      - 'scripts/phase6-browser-ci.mjs'
      - 'scripts/atlas-focus-browser-ci.mjs'
      - 'scripts/atlas-cinematic-browser-ci.mjs'
      - 'scripts/system-zoom-browser-ci.mjs'
      - 'vite.config.ts'
      - '.github/workflows/atlas-validation.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Archived original Atlas source model and handoff checks
        run: node --test map-of-the-all/tests/*.node-check.mjs
      - name: Existing and new planner importer tests
        run: npm run test
      - name: TypeScript compatibility
        run: npm run typecheck
      - name: Production multi-entry build
        run: npm run build
      - name: Bundle and PWA budgets
        run: npm run bundle:report
      - name: Install CI-only browser driver
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit playwright-core@1.56.1
      - name: Verify correct browser contract for current legacy route
        run: |
          set -eu
          if grep -q 'READ-ONLY LEGACY ENTRY' map-of-the-all/index.html; then
            node scripts/legacy-retirement-browser-ci.mjs
          else
            node scripts/atlas-focus-browser-ci.mjs
            node scripts/atlas-cinematic-browser-ci.mjs
            node scripts/system-zoom-browser-ci.mjs
            node scripts/spatial-studio-browser-ci.mjs
            node scripts/phase4-browser-ci.mjs
            node scripts/phase5-browser-ci.mjs
            node scripts/phase6-browser-ci.mjs
          fi
      - name: Preserve Atlas UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-all-phases-visual-qa
          path: atlas-qa-evidence/*.png
          if-no-files-found: ignore
          retention-days: 14
